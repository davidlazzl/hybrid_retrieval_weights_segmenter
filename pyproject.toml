[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "davidlazzl-hybrid_retrieval_weights_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对广告召回与排序工程师·混合检索的权重调节相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "davidlazzl" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://davidlazzl.github.io"
Repository = "https://github.com/davidlazzl/hybrid_retrieval_weights_segmenter"
Issues = "https://github.com/davidlazzl/hybrid_retrieval_weights_segmenter/issues"

[project.scripts]
hybrid_retrieval_weights_segmenter = "hybrid_retrieval_weights_segmenter:main"

[tool.setuptools]
py-modules = ["hybrid_retrieval_weights_segmenter"]
